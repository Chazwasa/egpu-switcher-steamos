# egpu-switcher: start Game Mode on the eGPU when one with a connected display is present.
# Remove this file and run "systemctl --user daemon-reload" to go back to Valve's session.
[Service]
ExecStart=
ExecStart=%h/.local/lib/egpu-switcher/gamescope-session
# Every switch restarts Game Mode. Valve allows gamescope 10 s to stop; it sometimes restarts Xwayland instead of
# exiting and is killed when that runs out. A clean stop takes up to about 3 s, so 5 s only shortens the stuck ones.
TimeoutStopSec=5
